name = "vidshelf-sync"
main = "index.js"
compatibility_date = "2026-09-01"

[[d1_databases]]
binding = "DB"
database_name = "vidshelf"
database_id = "DATABASE_ID_PLACEHOLDER"

[[r2_buckets]]
binding = "THUMBS"
bucket_name = "vidshelf-thumbs"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "vidshelf-media"
