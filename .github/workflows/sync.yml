# Deploys the D1 + Worker sync backend. Manual only: the backend is deployed
# once and persists; no need to redeploy on push (keeps Linux minutes tiny).
name: Sync backend

on:
  workflow_dispatch:

concurrency:
  group: sync-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ensure D1 database exists
        run: |
          id=$(npx --yes wrangler@latest d1 list --json | jq -r '.[] | select(.name=="vidshelf") | .uuid')
          if [ -z "$id" ]; then
            npx --yes wrangler@latest d1 create vidshelf
            id=$(npx --yes wrangler@latest d1 list --json | jq -r '.[] | select(.name=="vidshelf") | .uuid')
          fi
          sed -i "s/DATABASE_ID_PLACEHOLDER/$id/" wrangler.toml
          grep database_id wrangler.toml
      - name: Ensure R2 buckets exist
        run: |
          for b in vidshelf-thumbs vidshelf-media; do
            out=$(npx --yes wrangler@latest r2 bucket create "$b" 2>&1) && echo "$out" || { echo "$out"; echo "$out" | grep -qi 'already exists' || exit 1; }
          done
      - name: Apply schema
        run: |
          npx --yes wrangler@latest d1 execute vidshelf --remote --file schema.sql --yes
          npx --yes wrangler@latest d1 execute vidshelf --remote --file schema-v4.sql --yes
      - name: Set sync key on the worker
        run: echo "${{ secrets.VIDSHELF_SYNC_KEY }}" | npx --yes wrangler@latest secret put VIDSHELF_KEY
      - name: Deploy worker
        run: npx --yes wrangler@latest deploy
