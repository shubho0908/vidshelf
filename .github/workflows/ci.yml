# Runs on every push/PR: Linux-only. Tests + both builds (app + web bundle).
# Linux minutes are the cheapest tier - designed to stay far inside the
# 2,000 free minutes/month. No macOS here: dmg builds live in release.yml
# and only run on version tags.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx vitest run
      - run: npm run build
      - run: npm run build:web
      - name: Baked sync key must never reach the public web bundle
        run: |
          key=$(grep -o '"[0-9a-f]\{48\}"' src/syncKey.baked.ts | tr -d '"')
          if grep -rq "$key" dist-web/; then echo "LEAK: baked key in web bundle"; exit 1; fi
          echo "web bundle clean"
