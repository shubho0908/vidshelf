# Runs on every push/PR: Linux-only. Tests + web build + webOS ipk.
# Linux minutes are the cheapest tier ($0.006/min) - designed to stay far
# inside the 2,000 free minutes/month. No macOS here: dmg builds live in
# release.yml and only run on version tags.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build-ipk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx vitest run
      - run: npm run build
      - name: Install webOS CLI
        run: npm install -g @webos-tools/cli
        working-directory: .
      - name: Package webOS ipk
        run: ./scripts/package-webos.sh
        working-directory: .
      - uses: actions/upload-artifact@v4
        with:
          name: vidshelf-ipk
          path: build/*.ipk
          retention-days: 7
