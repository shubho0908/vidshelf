[package]
name = "vidshelf"
version = "1.0.0"
description = "VidShelf - paste a link, it plays"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "vidshelf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
